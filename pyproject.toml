[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-pilot"
version = "1.0.0"
description = "Cross-platform Xcode replacement. Build and deploy iOS apps with SwiftPM on Linux, Windows, macOS."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
maintainers = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["ios", "swift", "swiftpm", "xcode", "cross-platform", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.35",
    "alembic==1.13.2",
    "python-multipart==0.0.12",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.8",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/lumen-pilot-alan-vo"
Repository = "https://github.com/ALANDVO/lumen-pilot-alan-vo"
Issues = "https://github.com/ALANDVO/lumen-pilot-alan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100